# Copia este archivo como "config.properties" (en esta misma carpeta, servidor/)
# y escribe tus datos de MySQL. config.properties NO se sube a git.

# Servidor MySQL (si corre en la misma VM que el servidor Java, deja localhost)
db.host=localhost
db.port=3306
db.name=restordb

# Usuario y contraseña de MySQL (NO las de Jugador1, Jugador2, ...)
db.user=TU_USUARIO_MYSQL
db.password=TU_CONTRASENA_MYSQL
